spring:
  application:
    name: recon
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recon}
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned entirely by Flyway migrations, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
